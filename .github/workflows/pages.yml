name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Push built docs/ to the gh-pages branch (no GitHub Pages artifact actions).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Publish to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          touch docs/.nojekyll
          site_dir="$RUNNER_TEMP/site"
          rm -rf "$site_dir"
          cp -R docs "$site_dir"

          worktree="$RUNNER_TEMP/gh-pages"
          rm -rf "$worktree"
          mkdir -p "$worktree"

          repo="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --heads "$repo" gh-pages | grep -q gh-pages; then
            git clone --depth 1 --branch gh-pages "$repo" "$worktree"
          else
            git init "$worktree"
            cd "$worktree"
            git checkout -b gh-pages
            git remote add origin "$repo"
          fi

          cd "$worktree"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R "$site_dir"/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push origin gh-pages
